[package]
name = "kast"
version = "0.8.3"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Kud3n's Arch Setup Tool: Arch Linux / CachyOS fast setup TUI with an embedded App Vault backup engine"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
libc = "0.2.190"
qrcode = { version = "0.14.1", default-features = false }
nix = { version = "0.31.3", features = ["user", "fs", "signal", "term", "poll", "hostname", "ioctl"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
signal-hook = "0.4.5"
tempfile = "3.27.0"
toml = "1.1.8"
walkdir = "2.5.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
insta = "1.49.0"

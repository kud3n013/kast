[package]
name = "arch-setup"
version = "0.1.0"
edition = "2024"
description = "Arch Linux / CachyOS fast setup TUI with an embedded App Vault backup engine"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
filetime = "0.2.29"
libc = "0.2.190"
nix = { version = "0.31.3", features = ["user", "fs", "signal", "term", "poll", "hostname", "ioctl"] }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
signal-hook = "0.4.5"
tempfile = "3.27.0"
walkdir = "2.5.0"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs", "chrono"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# What `kast packages` (menu option 4) and the automatic run install, in this order.
#
# kast downloads this file from the main branch on every run
# (https://raw.githubusercontent.com/kud3n013/kast/main/packages.toml), so an edit pushed to
# main reaches every user on their next run, with no release. The copy built into each kast
# binary is the fallback: offline, on a download error, or when this file fails validation.
#
# Format rules:
# - `schema` is the format version. Add new optional fields freely: older kast versions
#   ignore fields they don't know. Bump `schema` only for a breaking change, and only after
#   a kast release that understands the new version is out; older versions then fall back
#   to their built-in list and tell the user to update.
# - Groups: official, cachyos, kud3n, addons (any other id is skipped with a warning).
# - Per package: `name` (required), `description`, `fallback` (installed instead when `name`
#   isn't in the sync databases but the fallback is), `replaces` (an installed legacy package
#   swapped out, only if `name` declares a conflict with it), `requires` (the package this
#   add-on belongs to; must be in this file).
# - Names: lowercase package names, optionally prefixed with a known repo (`archrepo/`).
#   `cargo test` validates this file, and so does kast before using a downloaded copy.
# - archrepo's own packages need no entry here. kast reads archrepo's signed package database
#   and adds every package this file doesn't mention: as an add-on of a listed package it
#   depends on, else to the kud3n group, marked "from archrepo". An entry here is for an
#   exception or an override (the group, a description, `requires`, `replaces`), and wins
#   over the automatic one. The optional top-level table below turns that off or keeps
#   packages out of it; it needs no `schema` bump, older kast versions ignore it:
#     [archrepo]
#     auto = true                 # merge archrepo's packages (default true)
#     exclude = ["some-package"]  # never added automatically (default none)

schema = 1

[[group]]
id = "official"
name = "Official repositories"
packages = [
  { name = "zen-browser-bin" },
  { name = "proton-vpn-cli" },
  { name = "inkscape" },
  { name = "helium-browser-bin" },
  { name = "fcitx5" },
  { name = "fcitx5-configtool" },
  { name = "fcitx5-gtk" },
  { name = "fcitx5-qt" },
  { name = "fcitx5-unikey" },
  { name = "vesktop-bin", fallback = "vesktop" },
  { name = "valkey" },
  { name = "kdenlive" },
  { name = "steam" },
  { name = "wine" },
  { name = "wine-gecko" },
  { name = "wine-mono" },
  { name = "gwenview" },
  { name = "haruna" },
  { name = "github-cli" },
  { name = "github-copilot-cli" },
  { name = "git" },
  { name = "deno" },
  { name = "asar" },
  { name = "nodejs" },
  { name = "jre-openjdk" },
  { name = "namcap" },
  { name = "shellcheck" },
  { name = "claude-code" },
  { name = "claude-desktop" },
  { name = "oxygen5" },
  { name = "oxygen-cursors" },
  { name = "oxygen-icons" },
  { name = "oxygen-icons-svg" },
]

# Packages only the CachyOS repositories carry. Empty for now: which of the entries above
# come from cachyos* repos hasn't been verified on a CachyOS machine yet.
[[group]]
id = "cachyos"
name = "CachyOS repositories"
packages = []

[[group]]
id = "kud3n"
name = "kud3n's repository"
packages = [
  { name = "beeper" },
  { name = "archrepo/zed-globalmenu", replaces = "zed" },
  { name = "zotero" },
  { name = "howdy-next" },
  { name = "gdlauncher-carbon" },
  { name = "searxng" },
  { name = "freedownloadmanager", replaces = "freedownloadmanager-bin" },
  { name = "sine"},
  { name = "archrepo/obsidian" },
  # CachyOS carries it too, but updates it late
  { name = "archrepo/proton-pass" },
  # Depends on dbusmenu-shortcut-shim, but is an app of its own, not an add-on of it
  { name = "archrepo/cursor" },
  { name = "kast" },
  { name = "dbusmenu-shortcut-shim" },
]

[[group]]
id = "addons"
name = "Add-ons"
packages = [
  { name = "freedownloadmanager-elephant", requires = "freedownloadmanager" },
  { name = "zotero-better-bibtex", requires = "zotero" },
  { name = "zotmoov", requires = "zotero" },
  { name = "zotero-better-notes", requires = "zotero" },
  { name = "zotero-ocr", requires = "zotero" },
  { name = "zotero-pdf-translate", requires = "zotero" },
  { name = "zotero-mcp", requires = "zotero" },
]
